<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - تسجيل الدخول | Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f7f4ed;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid #1e382d;
            border-bottom: 6px solid #b8860b;
        }

        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #b8860b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e382d;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcd6c8;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #faf8f5;
        }

        .form-group input:focus {
            border-color: #1e382d;
            outline: none;
            background-color: #fff;
        }

        .login-btn {
            background-color: #1e382d;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #2c4a3e;
        }
    </style>
</head>

<body>

    <div class="login-card">
        <!-- شعار الكلية الواضح -->
        <img src="image.jpg" alt="شعار كلية العلوم الرياضية والحاسوب" class="login-logo">
        
        <h2 style="color: #1e382d; margin-top: 5px; font-size: 22px;">بوابة الطالب</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 25px;">تسجيل الدخول للدفعة 43 - جامعة الجزيرة</p>

        <!-- نموذج تسجيل الدخول -->
        <form action="check_login.php" method="POST" onsubmit="return validateForm()">
            <div class="form-group">
                <label for="reg_number">رقم التسجيل الجامعي:</label>
                <input type="text" id="reg_number" name="reg_number" placeholder="مثال: 2026-43-01" required>
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" name="login_btn" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>

    <!-- كود JavaScript للتحقق من الحقول -->
    <script>
        function validateForm() {
            var regNumber = document.getElementById('reg_number').value;
            var password = document.getElementById('password').value;
            if (regNumber.trim() === "" || password.trim() === "") {
                alert("الرجاء إدخال رقم التسجيل وكلمة المرور!");
                return false;
            }
            return true;
        }
    </script>
<script src="script.js"></script>
</body>
</html>
