<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body.login-body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f7f4ed;
            margin: 0;
            padding: 15px;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid #1e382d;
            border-bottom: 6px solid #b8860b;
        }

        /* تصحيح عرض الشعار لضمان ظهوره بشكل دائري وفخم */
        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #b8860b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e382d;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcd6c8;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #faf8f5;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1e382d;
            background-color: #fff;
        }

        .login-btn {
            background-color: #1e382d;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #2c4a3e;
        }
    </style>
</head>

<body class="login-body">

    <div class="login-card">
        <!-- شعار الكلية (تم ضبط المسار بدقة لضمان ظهوره) -->
        <img src="image/image.jpg" alt="شعار كلية العلوم الرياضية والحاسوب" class="login-logo" onerror="this.onerror=null; this.src='image.jpg';">
        
        <h2 style="color: #1e382d; margin-top: 5px; font-size: 22px;">بوابة الطالب</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 25px;">تسجيل الدخول للدفعة 43 - جامعة الجزيرة</p>

        <!-- نموذج تسجيل الدخول المربوط بالصفحة الرئيسية -->
        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="reg_number">رقم التسجيل الجامعي:</label>
                <input type="text" id="reg_number" name="reg_number" placeholder="مثال: 43..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">تسجيل الدخول [Execute]</button>
        </form>
    </div>

    <!-- كود JavaScript للتحقق والتوجيه الفوري لـ index.html -->
    <script>
        function handleLogin(event) {
            event.preventDefault(); // منع إعادة تحميل الصفحة التقليدي
            var regNumber = document.getElementById('reg_number').value;
            var password = document.getElementById('password').value;
            
            if (regNumber.trim() === "" || password.trim() === "") {
                alert("الرجاء إدخال رقم التسجيل وكلمة المرور!");
                return false;
            }

            // محاكاة تسجيل الدخول الناجح والتوجيه للبوابة الرئيسية
            alert("تم تسجيل الدخول بنجاح! جاري الانتقال للبوابة...");
            window.location.href = "index.html"; 
            return false;
        }
    </script>
</body>
</html>
