<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جامعتي | تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">

    <main class="login-card">
        <!-- شريط النافذة البرمجية -->
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="btn-dot close"></span>
                <span class="btn-dot minimize"></span>
                <span class="btn-dot maximize"></span>
            </div>
            <div class="terminal-title">student_portal.cs</div>
        </div>

        <div class="login-content">
            <div class="login-header-section">
                <img src="image/image.jpg" alt="شعار الكلية" class="college-logo-small">
                <div class="cs-badge">&lt;/&gt; Batch 43 Portal</div>
                <h1>بوابة علوم الحاسوب</h1>
                <p>تسجيل الدخول - جامعة الجزيرة</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="studentId">رقم التسجيل / الرقم الجامعي</label>
                    <div class="input-box-wrapper">
                        <span class="field-icon">🆔</span>
                        <input type="text" id="studentId" placeholder="مثال: 43..." required autocomplete="off">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">كلمة المرور (Password)</label>
                    <div class="input-box-wrapper">
                        <span class="field-icon">🔒</span>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" id="togglePassword" class="eye-toggle-btn" title="إظهار/إخفاء كلمة المرور">👁️</button>
                    </div>
                </div>

                <div id="terminalConsole" class="terminal-console">
                    <div class="console-line"><span class="prompt">&gt;</span> Initializing auth sequence...</div>
                </div>

                <button type="submit" id="submitBtn" class="login-action-btn">
                    <span>تشغيل الدخول [Execute]</span>
                    <span>⚡</span>
                </button>

                <p id="message" role="status"></p>
            </form>

            <div class="cs-tags-wrapper">
                <span>#AI_Lab</span>
                <span>#Web_Dev</span>
                <span>#Algorithms</span>
                <span>#CyberSec</span>
            </div>

            <p class="demo-note-text">
                <code>// نسخة تجريبية — تصميم طالبة علوم حاسوب 💻</code>
            </p>
        </div>
    </main>

    <script>
        // إظهار/إخفاء كلمة المرور
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwd = document.getElementById('password');
            pwd.type = (pwd.type === 'password') ? 'text' : 'password';
        });

        // الربط المباشر بصفحة index.html عند الضغط على تسجيل الدخول
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const consoleDiv = document.getElementById('terminalConsole');
            consoleDiv.style.display = 'block';
            const msg = document.getElementById('message');
            msg.textContent = "جاري التحقق والتوجيه للبوابة...";
            msg.className = "success";
            
            setTimeout(() => {
                window.location.href = "index.html"; // التوجيه الفوري للصفحة الرئيسية
            }, 800);
        });
    </script>
</body>
</html>
