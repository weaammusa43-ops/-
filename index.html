<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة الطالب - تسجيل الدخول</title>
    <link rel="stylesheet" href="css/style.css">

    <style>
        body.login-body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f7f4ed;
            margin: 0;
            padding: 15px;
        }

        .login-card {
            background: white;
            padding: 35px 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border-top: 6px solid #1e382d;
            border-bottom: 6px solid #b8860b;
        }

        /* تصحيح عرض الشعار لضمان ظهوره بشكل دائري وفخم */
        .login-logo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #b8860b;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            margin-bottom: 15px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1e382d;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcd6c8;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #faf8f5;
            outline: none;
        }

        .form-group input:focus {
            border-color: #1e382d;
            background-color: #fff;
        }

        .login-btn {
            background-color: #1e382d;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background-color: #2c4a3e;
        }

        /* تنسيق روابط إضافية (إنشاء حساب / نسيت كلمة المرور) بأناقة متوافقة */
        .extra-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 13px;
        }

        .extra-links a {
            color: #1e382d;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .extra-links a:hover {
            color: #b8860b;
            text-decoration: underline;
        }
    </style>
</head>

<body class="login-body">

    <div class="login-card">
        <!-- شعار الكلية الدائري الفخم -->
        <img src="image/image.jpg" alt="شعار كلية العلوم الرياضية والحاسوب" class="login-logo" onerror="this.onerror=null; this.src='image.jpg';">
        
        <h2 style="color: #1e382d; margin-top: 5px; font-size: 22px;">بوابة الطالب</h2>
        <p style="color: #666; font-size: 13px; margin-bottom: 25px;">تسجيل الدخول للدفعة 43 - جامعة الجزيرة</p>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm">
            <div class="form-group">
                <label for="reg_number">رقم التسجيل الجامعي:</label>
                <input type="text" id="reg_number" name="reg_number" placeholder="مثال: 43..." required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">تسجيل الدخول [Execute]</button>
        </form>

        <!-- روابط إضافية لإنشاء حساب واستعادة كلمة المرور -->
        <div class="extra-links">
            <a href="register.php">إنشاء حساب جديد</a>
            <a href="forgot-password.php">نسيت كلمة المرور؟</a>
        </div>
    </div>

    <!-- كود الجافاسكريبت للانتقال السلس وتخزين بيانات الجلسة المؤقتة لحين اكتمال الـ Backend -->
    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault(); // منع إعادة التحميل العشوائي
            
            const regNumber = document.getElementById("reg_number").value.trim();
            const password = document.getElementById("password").value.trim();

            if (regNumber === "" || password === "") {
                alert("الرجاء إدخال البيانات كاملة!");
                return;
            }

            // حفظ حالة الدخول ورقم التسجيل لاستخدامه في عرض اسم الطالب والترحيب به لاحقاً
            localStorage.setItem("isLoggedIn", "true");
            localStorage.setItem("studentReg", regNumber);

            // الانتقال المباشر للصفحة الرئيسية
            window.location.href = "home.html";
        });
    </script>
</body>

</html>
