<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - إدارة المحاضرات | Lectures</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .lecture-section {
            background: var(--card-bg, #fff);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            margin-bottom: 20px;
            overflow: hidden;
            border-right: 6px solid #1e382d;
            scroll-margin-top: 25px;
            transition: all 0.4s ease;
        }

        .lecture-section:target {
            border-right: 8px solid #b8860b !important;
            box-shadow: 0 0 20px rgba(184, 134, 11, 0.4) !important;
        }

        .lecture-section:target summary {
            background-color: #fef3c7 !important;
            color: #b8860b !important;
        }

        details { width: 100%; }

        summary {
            background-color: #f9f8f5;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: bold;
            color: #1e382d;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e8e3d5;
            transition: background 0.3s;
            outline: none;
            user-select: none;
        }

        .lecture-content {
            padding: 20px;
            background: inherit;
        }

        .admin-controls-box {
            background: rgba(16, 185, 129, 0.08);
            border: 2px dashed #10b981;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .admin-controls-box h4 {
            color: #065f46;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .input-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .input-group input[type="text"] {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            flex: 1;
            min-width: 180px;
            font-size: 13px;
            outline: none;
        }

        .input-group input[type="file"] {
            font-size: 12px;
            background: #fff;
            padding: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            color: #333;
        }

        .btn-add {
            background: #1e382d;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .btn-add:hover { background: #2c4a3e; }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            margin-top: 10px;
            border-radius: 8px;
        }

        .lectures-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 450px;
        }

        .lectures-table th, .lectures-table td {
            padding: 12px 15px;
            text-align: right;
            border-bottom: 1px solid #f1eeec;
            font-size: 14px;
        }

        .lectures-table th {
            background-color: #1e382d;
            color: white;
            font-weight: 600;
        }

        .pdf-btn {
            background: #10b981;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .delete-btn:hover { background: #dc2626; }

        .spec-header-title {
            color: #1e382d;
            border-bottom: 2px solid #1e382d;
            padding-bottom: 8px;
            margin-top: 30px;
            margin-bottom: 15px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <!-- ================= HEADER ================= -->
    <header>
        <h1>Student Portal | بوابة المحاضرات الأكاديمية</h1>
        <p>جامعة الجزيرة - كلية العلوم الرياضية والحاسوب (إدارة المحاضرات حسب جدول الدفعة 43)</p>
    </header>
